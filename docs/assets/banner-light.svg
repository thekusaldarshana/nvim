<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="nvim: A readable Neovim config, from scratch.">
<title>nvim: A readable Neovim config, from scratch.</title>
<rect width="1280" height="300" rx="20" fill="#F7F5F0"/>
<text x="72" y="122" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="-2" fill="#16161A">nvim</text>
<text x="76" y="172" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#16161A">A readable Neovim config, from scratch.</text>
<text x="76" y="210" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5E5E66">lazy.nvim · LSP · 16-color console support</text>
<rect x="830" y="42" width="390" height="215" rx="12" fill="#EFECE5" stroke="#D3CEC3" stroke-width="2"/><text x="852" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#5c8c84">init.lua</text><line x1="830" y1="87" x2="1220" y2="87" stroke="#D3CEC3"/><text x="850" y="119" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#5E5E66">1</text><text x="879" y="119" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#16161A">vim.opt.number = true</text><text x="850" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#5E5E66">2</text><text x="879" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#16161A">vim.opt.shiftwidth = 2</text><text x="850" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#5E5E66">3</text><text x="879" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#16161A">vim.opt.expandtab = true</text><text x="850" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#5E5E66">4</text><text x="879" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#5E5E66">-- readable by design</text>
</svg>
